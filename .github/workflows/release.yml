name: Build and Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish application
        run: dotnet publish src/PRomda.FileShare.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist
      - name: Create release and upload application
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: dist/PRomda.FileShare.exe
      - name: Build installer
        shell: powershell
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\PRomda.iss'
      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: installer/output/PRomda-FileShare-Installer.exe
